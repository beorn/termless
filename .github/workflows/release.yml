# vendor-kit: release@80f845f6564f — generated; edit km/packages/km-infra/vendor-kit/templates/release.yml in km, then re-sync
name: Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full public main commit to release
        required: true
        type: string
      packages:
        description: Ordered JSON array of package names and versions
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.artifacts.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Validate dispatch identity and planned package versions
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_PACKAGES: ${{ inputs.packages }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { spawnSync } from 'node:child_process'
          import { join } from 'node:path'
          const fail = message => { throw Error('RELEASE_PREFLIGHT: ' + message) }
          const commit = process.env.RELEASE_COMMIT
          if (!/^[0-9a-f]{40}$/.test(commit ?? '')) fail('commit must be a full lowercase SHA')
          if (process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch' || process.env.GITHUB_REF !== 'refs/heads/main') fail('run must dispatch on main')
          const head = spawnSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' })
          if (head.status !== 0 || head.stdout.trim() !== commit || process.env.GITHUB_SHA !== commit) fail('requested commit, checkout and run SHA differ')
          const npm = spawnSync('npm', ['--version'], { encoding: 'utf8' })
          const parts = npm.stdout.trim().split('.').map(Number)
          if (npm.status !== 0 || parts[0] < 11 || (parts[0] === 11 && (parts[1] < 5 || (parts[1] === 5 && parts[2] < 1)))) fail('npm >=11.5.1 required; found ' + npm.stdout.trim())
          let plan
          try { plan = JSON.parse(process.env.RELEASE_PACKAGES ?? '') } catch { fail('packages must be JSON') }
          if (!Array.isArray(plan) || plan.length === 0) fail('packages must be a nonempty array')
          const tracked = spawnSync('git', ['ls-files', '-z'], { encoding: 'utf8' })
          if (tracked.status !== 0) fail('cannot list tracked manifests')
          const paths = tracked.stdout.split('\0').filter(path => path === 'package.json' || /^packages\/[^/]+\/package\.json$/.test(path))
          const manifests = paths.map(path => {
            try { return { path, value: JSON.parse(readFileSync(path, 'utf8')) } }
            catch (error) { fail('invalid tracked manifest ' + path + ': ' + String(error)) }
          })
          const selected = new Map()
          for (const [index, item] of plan.entries()) {
            if (!item || typeof item.name !== 'string' || typeof item.version !== 'string' || Object.keys(item).sort().join(',') !== 'name,version') fail('invalid package row ' + index)
            if (selected.has(item.name)) fail('duplicate package ' + item.name)
            const matches = manifests.filter(({ value }) => value.name === item.name && value.private !== true)
            if (matches.length !== 1) fail(item.name + ' has ' + matches.length + ' public tracked manifests')
            const manifest = matches[0].value
            if (manifest.version !== item.version) fail(item.name + ' manifest version ' + manifest.version + ' differs from ' + item.version)
            const repository = typeof manifest.repository === 'string' ? manifest.repository : manifest.repository?.url
            const expected = 'https://github.com/' + process.env.GITHUB_REPOSITORY + '.git'
            if (repository !== expected && repository !== 'github:' + process.env.GITHUB_REPOSITORY) fail(item.name + ' repository ' + repository + ' differs from ' + expected)
            selected.set(item.name, { index, manifest })
          }
          for (const [name, { index, manifest }] of selected) {
            for (const dependency of Object.keys({ ...manifest.dependencies, ...manifest.optionalDependencies })) {
              const predecessor = selected.get(dependency)
              if (predecessor && predecessor.index >= index) fail(name + ' must follow dependency ' + dependency)
            }
          }
          for (const { name, version } of plan) {
            const url = 'https://registry.npmjs.org/' + encodeURIComponent(name) + '/' + encodeURIComponent(version)
            const response = await fetch(url, { signal: AbortSignal.timeout(15000) })
            if (response.status === 200) fail(name + '@' + version + ' already exists; root must verify its attestation before resuming')
            if (response.status !== 404) fail(name + '@' + version + ' registry preflight returned HTTP ' + response.status)
          }
          writeFileSync(join(process.env.RUNNER_TEMP, 'release-plan.json'), JSON.stringify(plan))
          NODE

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: mkdir "$RUNNER_TEMP/verified-tarballs"
      - name: Verify the repository and retain its exact tarballs
        id: verify
        uses: beorn/verify-publishable@208fac58810b31b9cf4b1b0ec0eae45f85d0e74c
        with:
          output-dir: ${{ runner.temp }}/verified-tarballs
      - name: Keep the verifier's report beside the tarballs
        env:
          REPORT: ${{ steps.verify.outputs.report }}
        run: cp "$REPORT" "$RUNNER_TEMP/verified.json"

      - name: Validate the retained artifact handoff
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { lstatSync, readFileSync, readdirSync, realpathSync } from 'node:fs'
          import { basename, isAbsolute, join, relative } from 'node:path'
          const fail = message => { throw Error('RELEASE_HANDOFF: ' + message) }
          const root = join(process.env.RUNNER_TEMP, 'verified-tarballs')
          if (!lstatSync(root).isDirectory() || lstatSync(root).isSymbolicLink()) fail('tarball directory must be a regular directory')
          const dir = realpathSync(root)
          const plan = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'release-plan.json'), 'utf8'))
          const verified = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'verified.json'), 'utf8'))
          if (verified.schema !== 'verify-publishable/v1' || verified.ok !== true || !Array.isArray(verified.packages) || verified.packages.length !== plan.length) fail('verifier did not report the exact passed package set')
          const files = new Set()
          for (const { name, version } of plan) {
            const matches = verified.packages.filter(item => item.name === name && item.version === version)
            if (matches.length !== 1) fail(name + '@' + version + ' has ' + matches.length + ' verified artifacts')
            const artifact = matches[0]
            if (typeof artifact.tarballPath !== 'string' || !isAbsolute(artifact.tarballPath) || typeof artifact.sha512 !== 'string') fail(name + '@' + version + ' has no retained absolute tarball path or SHA-512')
            const file = basename(artifact.tarballPath)
            if (!file.endsWith('.tgz') || files.has(file)) fail('invalid or colliding tarball ' + file)
            const stat = lstatSync(artifact.tarballPath)
            if (!stat.isFile() || stat.isSymbolicLink()) fail('tarball is not a regular file: ' + file)
            const path = realpathSync(artifact.tarballPath)
            if (relative(dir, path) !== file) fail('tarball escaped retained directory: ' + artifact.tarballPath)
            const digest = 'sha512-' + createHash('sha512').update(readFileSync(path)).digest('base64')
            if (digest !== artifact.sha512) fail(name + '@' + version + ' retained digest differs from verifier')
            files.add(file)
          }
          if (JSON.stringify(readdirSync(dir).sort()) !== JSON.stringify([...files].sort())) fail('retained file set differs from plan')
          NODE
      - name: Retain the report, plan and verified tarballs
        id: artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release
          path: |
            ${{ runner.temp }}/verified.json
            ${{ runner.temp }}/release-plan.json
            ${{ runner.temp }}/verified-tarballs
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}
          merge-multiple: true

      - name: Publish verified files through npm Trusted Publishing
        id: publish
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_PACKAGES: ${{ inputs.packages }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { spawnSync } from 'node:child_process'
          import { appendFileSync, lstatSync, readFileSync, readdirSync, realpathSync, writeFileSync } from 'node:fs'
          import { basename, isAbsolute, join, relative } from 'node:path'
          const fail = message => { throw Error('RELEASE_PUBLISH: ' + message) }
          const commit = process.env.RELEASE_COMMIT
          if (!/^[0-9a-f]{40}$/.test(commit ?? '') || commit !== process.env.GITHUB_SHA) fail('requested commit and run SHA must match a full lowercase SHA')
          if (process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch' || process.env.GITHUB_REF !== 'refs/heads/main') fail('run must dispatch on main')
          const npm = spawnSync('npm', ['--version'], { encoding: 'utf8' })
          const version = /^(\d+)\.(\d+)\.(\d+)$/.exec(npm.stdout.trim())
          if (npm.status !== 0 || !version || Number(version[1]) < 11 || (Number(version[1]) === 11 && (Number(version[2]) < 5 || (Number(version[2]) === 5 && Number(version[3]) < 1)))) fail('npm >=11.5.1 required; found ' + npm.stdout.trim())
          const requested = JSON.parse(process.env.RELEASE_PACKAGES ?? '')
          if (!Array.isArray(requested) || requested.length === 0) fail('packages must be a nonempty array')
          const names = new Set()
          for (const item of requested) {
            if (!item || typeof item.name !== 'string' || !item.name || typeof item.version !== 'string' || !item.version || Object.keys(item).sort().join(',') !== 'name,version' || names.has(item.name)) fail('invalid or duplicate package row')
            names.add(item.name)
          }
          const plan = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'release-plan.json'), 'utf8'))
          if (JSON.stringify(plan) !== JSON.stringify(requested)) fail('uploaded ordered plan differs from dispatch packages')
          const verified = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'verified.json'), 'utf8'))
          if (verified.schema !== 'verify-publishable/v1' || verified.ok !== true || !Array.isArray(verified.packages) || verified.packages.length !== plan.length) fail('verifier did not report the exact passed package set')
          const root = join(process.env.RUNNER_TEMP, 'verified-tarballs')
          if (!lstatSync(root).isDirectory() || lstatSync(root).isSymbolicLink()) fail('tarball directory must be a regular directory')
          const outputDir = realpathSync(root)
          const files = new Set()
          const artifacts = plan.map(({ name, version }) => {
            const matches = verified.packages.filter(item => item.name === name && item.version === version)
            if (matches.length !== 1) fail(name + '@' + version + ' has ' + matches.length + ' verified artifacts')
            const artifact = matches[0]
            if (typeof artifact.tarballPath !== 'string' || typeof artifact.sha512 !== 'string') fail(name + '@' + version + ' has no retained tarball or SHA-512')
            if (!isAbsolute(artifact.tarballPath)) fail(name + '@' + version + ' retained path metadata must be absolute')
            const file = basename(artifact.tarballPath)
            if (!file.endsWith('.tgz') || files.has(file)) fail('invalid or colliding tarball ' + file)
            const local = join(outputDir, file)
            const stat = lstatSync(local)
            if (!stat.isFile() || stat.isSymbolicLink()) fail('tarball is not a regular file: ' + file)
            const path = realpathSync(local)
            const rel = relative(outputDir, path)
            if (rel !== file) fail(name + '@' + version + ' artifact escaped output directory')
            const digest = 'sha512-' + createHash('sha512').update(readFileSync(path)).digest('base64')
            if (digest !== artifact.sha512) fail(name + '@' + version + ' retained digest differs from verifier')
            files.add(file)
            return { name, version, path, digest }
          })
          if (JSON.stringify(readdirSync(outputDir).sort()) !== JSON.stringify([...files].sort())) fail('retained file set differs from plan')
          const recordPath = join(process.env.RUNNER_TEMP, 'release-record.json')
          const record = { schema: 'hh-release-run/v1', repository: process.env.GITHUB_REPOSITORY, workflow: process.env.GITHUB_WORKFLOW_REF, ref: process.env.GITHUB_REF, commit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, packages: artifacts.map(({ name, version, digest }) => ({ name, version, digest, state: 'not_published', publishedAt: null, firstServedAt: null, detail: null })) }
          const save = () => writeFileSync(recordPath, JSON.stringify(record, null, 2) + '\n')
          save()
          const publishEnv = { ...process.env }
          delete publishEnv.NODE_AUTH_TOKEN
          delete publishEnv.NPM_TOKEN
          for (const [index, item] of artifacts.entries()) {
            const row = record.packages[index]
            const current = 'sha512-' + createHash('sha512').update(readFileSync(item.path)).digest('base64')
            if (current !== item.digest) fail(item.name + '@' + item.version + ' tarball changed before publish')
            const publish = spawnSync('npm', ['publish', item.path, '--access', 'public', '--ignore-scripts', '--provenance'], { cwd: process.env.RUNNER_TEMP, env: publishEnv, stdio: 'inherit' })
            if (publish.status !== 0) {
              row.state = 'publish_failed'
              save()
              fail(item.name + '@' + item.version + ' npm publish failed with status ' + publish.status)
            }
            row.state = 'published_not_yet_served'
            row.publishedAt = new Date().toISOString()
            save()
            const url = 'https://registry.npmjs.org/' + encodeURIComponent(item.name) + '/' + encodeURIComponent(item.version)
            for (const delay of [0, 5000, 10000, 20000, 40000, 80000, 120000]) {
              if (delay) await new Promise(resolve => setTimeout(resolve, delay))
              const response = await fetch(url, { signal: AbortSignal.timeout(15000) })
              if (response.status === 404) {
                row.detail = 'manifest not served'
                continue
              }
              if (response.status !== 200) fail(item.name + '@' + item.version + ' registry read returned HTTP ' + response.status)
              const metadata = await response.json()
              if (metadata.dist?.integrity !== item.digest) {
                row.state = 'registry_mismatch'
                save()
                fail(item.name + '@' + item.version + ' registry integrity differs from published file')
              }
              if (!metadata.dist?.attestations?.url) {
                row.detail = 'attestation URL not served'
                continue
              }
              row.state = 'published_confirmed'
              row.firstServedAt = new Date().toISOString()
              row.detail = null
              break
            }
            save()
            if (row.state === 'published_not_yet_served') {
              const seconds = Math.round((Date.now() - Date.parse(row.publishedAt)) / 1000)
              console.log('::warning::' + item.name + '@' + item.version + ' published, not yet served after ' + seconds + 's; digest ' + item.digest + '; ' + row.detail)
            }
            console.log(item.name + '@' + item.version + ': ' + row.state + ' ' + item.digest)
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'states=' + JSON.stringify(record.packages.map(({ name, version, state }) => ({ name, version, state }))) + '\n')
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-record
          path: ${{ runner.temp }}/release-record.json
          if-no-files-found: warn
