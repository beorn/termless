name: Verify Publishable

# Local equivalent: `bunx --bun --no-install verify-publishable`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Verify publishable
        run: bunx --bun --no-install verify-publishable
