# vendor-kit: verify@d289cd20e88b — generated; edit km/packages/km-infra/vendor-kit/templates/verify.yml in km, then re-sync
name: Verify

# Light per-push gate: the suite + build must stay green on main so a release
# tag never discovers rot. Heavy checks belong in release.yml (pre-publish).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run test
      - run: bun run build
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify the packages this repository would publish
        uses: beorn/verify-publishable@84544e987d89716b004f53afcc89d8627ca50a9e
