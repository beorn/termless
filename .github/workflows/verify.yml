# vendor-kit: verify@798189e540c3 — generated; edit km/packages/km-infra/vendor-kit/templates/verify.yml in km, then re-sync
name: Verify

# Light per-push gate: the suite + build must stay green on main so a release
# tag never discovers rot. Heavy checks belong in release.yml (pre-publish).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: bun install
      - run: bun run test
      - run: bun run build
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify the packages this repository would publish
        uses: beorn/verify-publishable@208fac58810b31b9cf4b1b0ec0eae45f85d0e74c
