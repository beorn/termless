# vendor-kit: verify@aabd16b00fd9 — generated; edit km/packages/km-infra/vendor-kit/templates/verify.yml in km, then re-sync
name: Verify

# Light per-push gate: the suite + build must stay green on main so a release
# tag never discovers rot. Heavy checks belong in release.yml (pre-publish).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: bun install
      - run: bun run test
      - run: bun run build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Verify the packages this repository would publish
        uses: beorn/verify-publishable@208fac58810b31b9cf4b1b0ec0eae45f85d0e74c

